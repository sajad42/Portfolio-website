- name: Deploy to Cloud Run
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          AI_KEY: ${{ secrets.OPENAI_API_KEY }}
          WH_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --set-env-vars "DATABASE_URL=$DB_URL,OPENAI_API_KEY=$AI_KEY,GITHUB_WEBHOOK_SECRET=$WH_SECRET"